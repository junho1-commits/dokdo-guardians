name: Publish Dokdo game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare static game
        run: |
          mkdir -p _site
          cp *.html *.css *.js 교표.jpg _site/
          cp -r assets vendor _site/
          touch _site/.nojekyll
      - name: Version browser assets together
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = os.environ['ASSET_VERSION']
          for page in pathlib.Path('_site').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'((?:src|href)=["\x27])([^"\x27?]+\.(?:js|css))(["\x27])', lambda m: m[1] + m[2] + '?v=' + version + m[3], text)
              page.write_text(text, encoding='utf-8')
          for script in pathlib.Path('_site').rglob('*.js'):
              text = script.read_text(encoding='utf-8')
              text = re.sub(r'(from\s*["\x27])(\./[^"\x27?]+\.js)(["\x27])', lambda m: m[1] + m[2] + '?v=' + version + m[3], text)
              script.write_text(text, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
