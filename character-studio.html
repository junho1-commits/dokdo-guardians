</style><canvas id="studio" aria-label="산이와 나리의 입체 캐릭터. 화면을 드래그하여 회전할 수 있습니다."></canvas><header><small>MODEOK CHARACTER STUDIO</small><h1>산이와 나리</h1><p>화면을 드래그하면 모든 방향에서 볼 수 있어요.</p></header><span id="status">3D 모델 준비 중</span><a id="reference" href="assets/characters/sani-nari-turnaround-v3.png" target="_blank">다각도 설정화 보기 ↗</a><div class="names"><div>산이<small>SANI</small></div><div>나리<small>NARI</small></div></div><div class="controls"><button data-angle="0" aria-pressed="true">정면</button><button data-angle="0.65">45도</button><button data-angle="1.5708">옆모습</button><button data-angle="3.14159">뒷모습</button><button id="spin">자동 회전</button><a href="index.html">게임으로 돌아가기</a></div><script type="module">
import * as T from './vendor/three.module.js';import {createMascot} from './characters3d.js';
const canvas=document.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;

document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{angle=+b.dataset.angle;spin=false;document.querySelector('#spin').textContent='자동 회전';document.querySelectorAll('[data-angle]').forEach(x=>x.setAttribute('aria-pressed',x===b))});document.querySelector('#spin').onclick=()=>{spin=!spin;document.querySelector('#spin').textContent=spin?'회전 멈추기':'자동 회전'};canvas.onpointerdown=e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId);spin=false};canvas.onpointermove=e=>{if(drag!==null){angle+=(e.clientX-drag)*.009;drag=e.clientX}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;let last=0;function frame(t){if(spin)angle+=(t-last)*.00035;last=t;models.forEach(m=>m.rotation.y=angle);renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);document.querySelector('#status').textContent='실제 3D 모델 · v4';
